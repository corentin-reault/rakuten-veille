# K8s Secret template for the Apify token. You MUST fill the base64 value
# before applying (never commit a real token):
#
#   echo -n "YOUR_APIFY_TOKEN" | base64
#
# Then apply in BOTH staging and prod namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: veille-secrets
type: Opaque
data:
  # base64 of your Apify API token (apply once per namespace)
  APIFY_TOKEN: "REPLACE_WITH_BASE64_APIFY_TOKEN"